<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>ImageFit</title>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600&family=Instrument+Serif:ital@0;1&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#fafafa;--sur:#fff;--s2:#f5f5f5;
  --bd:#dbdbdb;--bl:#efefef;
  --t:#262626;--t2:#737373;--t3:#a8a8a8;
  --acc:#0095f6;--red:#ed4956;
  --grad:linear-gradient(135deg,#f09433,#e6683c,#dc2743,#cc2366,#bc1888);
  --sh:0 1px 3px rgba(0,0,0,.08);--sh2:0 4px 16px rgba(0,0,0,.10);
  --r:8px;--rl:18px;
}
*{box-sizing:border-box;margin:0;padding:0;}
body{font-family:'DM Sans',sans-serif;background:var(--bg);color:var(--t);min-height:100vh;overflow-x:hidden;}

/* HEADER */
.hdr{position:sticky;top:0;z-index:100;background:rgba(255,255,255,.94);backdrop-filter:blur(12px);border-bottom:1px solid var(--bl);height:56px;padding:0 16px;display:flex;align-items:center;justify-content:space-between;}
.logo{font-family:'Instrument Serif',serif;font-size:22px;background:var(--grad);-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text;}
#resetBtn{display:none;background:none;border:none;cursor:pointer;font:600 14px 'DM Sans',sans-serif;color:var(--red);padding:6px 12px;border-radius:8px;}
#resetBtn.on{display:block;}

/* WRAP */
.wrap{max-width:600px;margin:0 auto;padding:24px 16px 120px;}

/* UPLOAD */
.up-zone{border:2px dashed var(--bd);border-radius:var(--rl);background:var(--sur);padding:48px 20px;text-align:center;cursor:pointer;transition:all .2s;position:relative;overflow:hidden;}
.up-zone.drag,.up-zone:hover{border-color:#dc2743;background:#fff8f9;}
.up-ico{width:68px;height:68px;background:var(--s2);border-radius:50%;display:flex;align-items:center;justify-content:center;margin:0 auto 16px;}
.up-ico svg{width:30px;height:30px;}
.up-ttl{font-size:17px;font-weight:600;margin-bottom:8px;}
.up-sub{font-size:13px;color:var(--t2);line-height:1.5;}
.up-btn{display:inline-flex;align-items:center;gap:8px;margin-top:20px;background:var(--grad);color:#fff;border:none;cursor:pointer;font:600 14px 'DM Sans',sans-serif;padding:12px 24px;border-radius:10px;box-shadow:0 4px 14px rgba(220,39,67,.25);}
#fi{display:none;}

/* CARD */
.card{background:var(--sur);border:1px solid var(--bl);border-radius:var(--rl);overflow:hidden;margin-top:16px;box-shadow:var(--sh);animation:up .3s cubic-bezier(.34,1.56,.64,1) both;}
@keyframes up{from{opacity:0;transform:translateY(16px);}to{opacity:1;transform:translateY(0);}}
.c-hdr{padding:14px 20px;border-bottom:1px solid var(--bl);display:flex;align-items:center;justify-content:space-between;}
.c-ttl{font-size:14px;font-weight:600;display:flex;align-items:center;gap:8px;}
.step-n{width:22px;height:22px;background:var(--t);color:#fff;border-radius:50%;font-size:11px;font-weight:700;display:flex;align-items:center;justify-content:center;flex-shrink:0;}
.lnk{font-size:12px;font-weight:600;color:var(--acc);background:none;border:none;cursor:pointer;font-family:inherit;}

/* PREVIEW ROW */
.pv-row{padding:16px 20px;display:flex;align-items:center;gap:14px;}
.pv-thumb{width:72px;height:72px;border-radius:var(--r);object-fit:cover;border:1px solid var(--bl);flex-shrink:0;}
.pv-name{font-size:14px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.pv-meta{font-size:12px;color:var(--t2);margin-top:4px;}

/* PRESETS */
.preset-wrap{padding:16px 20px;}
.pg{display:grid;grid-template-columns:1fr 1fr;gap:10px;}
.pb{background:var(--s2);border:2px solid transparent;border-radius:var(--r);padding:13px 12px;cursor:pointer;text-align:left;transition:all .15s;}
.pb:hover{border-color:var(--bd);}
.pb.on{border-color:#dc2743;background:#fff5f6;}
.pb-name{font-size:13px;font-weight:600;}
.pb-size{font-size:11px;color:var(--t2);margin-top:2px;}
.pb-tag{display:inline-block;margin-top:5px;font-size:10px;font-weight:600;color:var(--acc);background:#e8f4fd;border-radius:4px;padding:2px 6px;}
.cust-row{display:none;padding:0 20px 16px;gap:10px;align-items:flex-end;}
.cust-row.on{display:flex;}
.ig{flex:1;}
.ig label{display:block;font-size:12px;font-weight:500;color:var(--t2);margin-bottom:5px;}
.ig input{width:100%;padding:10px 12px;border:1.5px solid var(--bd);border-radius:var(--r);font:600 14px 'DM Sans',sans-serif;color:var(--t);background:var(--s2);outline:none;}
.ig input:focus{border-color:var(--acc);background:#fff;}
.sep{font-size:18px;color:var(--t3);padding-bottom:10px;}

/* EDITOR */
.ed-sec{display:none;border-top:1px solid var(--bl);}
.ed-sec.on{display:block;}
.mode-badge{font-size:11px;font-weight:700;padding:3px 10px;border-radius:20px;}
.crop-b{background:#fff0f1;color:#dc2743;}
.exp-b{background:#f0f8ff;color:#0071bc;}
.hint-bar{padding:10px 20px;font-size:12px;color:var(--t2);background:var(--s2);border-bottom:1px solid var(--bl);display:flex;align-items:flex-start;gap:8px;line-height:1.5;}
.cv-outer{padding:16px 20px;display:flex;justify-content:center;}
.cv-wrap{border-radius:var(--r);overflow:hidden;cursor:grab;user-select:none;touch-action:none;box-shadow:var(--sh2);}
.cv-wrap.grabbing{cursor:grabbing;}
#ec{display:block;}
.ed-foot{display:flex;align-items:center;justify-content:space-between;padding:0 20px 12px;}
.btn-ctr{display:flex;align-items:center;gap:6px;font:600 12px 'DM Sans',sans-serif;color:var(--t2);background:var(--s2);border:1.5px solid var(--bd);border-radius:8px;padding:7px 13px;cursor:pointer;}
.readout{font-size:11px;color:var(--t3);}
.proc-wrap{padding:0 20px 20px;}
.btn-proc{width:100%;padding:15px;background:var(--grad);color:#fff;border:none;cursor:pointer;font:700 15px 'DM Sans',sans-serif;border-radius:var(--r);box-shadow:0 6px 18px rgba(220,39,67,.28);}

/* PROGRESS */
.prog{display:none;background:var(--sur);border:1px solid var(--bl);border-radius:var(--rl);padding:30px 24px;margin-top:16px;text-align:center;box-shadow:var(--sh);}
.prog.on{display:block;animation:up .3s ease both;}
.prog-ico{width:52px;height:52px;border-radius:50%;background:var(--s2);display:flex;align-items:center;justify-content:center;margin:0 auto 14px;position:relative;}
.prog-ico::after{content:'';position:absolute;inset:-3px;border-radius:50%;border:3px solid transparent;border-top-color:#dc2743;animation:spin .8s linear infinite;}
@keyframes spin{to{transform:rotate(360deg);}}
.prog-ttl{font-size:15px;font-weight:600;margin-bottom:5px;}
.prog-sub{font-size:12px;color:var(--t2);}
.prog-bg{height:4px;background:var(--bl);border-radius:2px;margin-top:16px;overflow:hidden;}
.prog-bar{height:100%;background:var(--grad);width:0%;transition:width .3s;}

/* RESULT */
.res-card{display:none;background:var(--sur);border:1px solid var(--bl);border-radius:var(--rl);overflow:hidden;margin-top:16px;box-shadow:var(--sh);}
.res-card.on{display:block;animation:up .35s cubic-bezier(.34,1.56,.64,1) both;}
.res-body{padding:18px 20px;}
.res-img-wrap{background:repeating-conic-gradient(#e0e0e0 0% 25%,#f5f5f5 0% 50%) 0 0/16px 16px;border-radius:var(--r);display:flex;align-items:center;justify-content:center;min-height:120px;max-height:480px;overflow:hidden;}
.res-img{max-width:100%;max-height:480px;object-fit:contain;display:block;}
.res-meta{display:flex;align-items:center;justify-content:space-between;margin-top:12px;padding:10px 14px;background:var(--s2);border-radius:var(--r);font-size:13px;color:var(--t2);}
.dl-row{display:flex;gap:8px;margin-top:12px;}
.btn-dl{flex:1;padding:12px;border:2px solid var(--bd);border-radius:var(--r);background:var(--sur);font:700 13px 'DM Sans',sans-serif;color:var(--t);cursor:pointer;display:flex;align-items:center;justify-content:center;gap:6px;transition:all .15s;}
.btn-dl:hover{border-color:var(--t);background:var(--t);color:#fff;}
.btn-dl.pri{background:var(--t);color:#fff;border-color:var(--t);}
.btn-dl.pri:hover{background:#000;border-color:#000;}

/* SLIDER */
.slider-wrap{margin-bottom:12px;}
.slider-track{display:flex;overflow-x:auto;scroll-snap-type:x mandatory;-webkit-overflow-scrolling:touch;gap:10px;padding:2px 2px 8px;scrollbar-width:none;}
.slider-track::-webkit-scrollbar{display:none;}
.mi{flex:0 0 100%;scroll-snap-align:center;border-radius:var(--r);overflow:hidden;border:2px solid transparent;transition:border-color .2s;cursor:pointer;}
.mi.sel{border-color:#dc2743;}
.mi-img-wrap{background:repeating-conic-gradient(#e0e0e0 0% 25%,#f5f5f5 0% 50%) 0 0/16px 16px;display:flex;align-items:center;justify-content:center;max-height:420px;overflow:hidden;}
.mi img{max-width:100%;max-height:420px;object-fit:contain;display:block;}
.mi-foot{display:flex;align-items:center;justify-content:space-between;padding:9px 14px;background:var(--s2);}
.mi-lbl{font-size:13px;font-weight:600;}
.mi-chk{width:20px;height:20px;background:#dc2743;border-radius:50%;display:none;align-items:center;justify-content:center;}
.mi.sel .mi-chk{display:flex;}
.slider-nav{display:flex;justify-content:space-between;margin-bottom:10px;}
.s-arr{display:flex;align-items:center;gap:5px;font:600 12px 'DM Sans',sans-serif;color:var(--t2);background:var(--s2);border:1.5px solid var(--bd);border-radius:8px;padding:7px 12px;cursor:pointer;transition:all .15s;}
.s-arr:hover{border-color:var(--t);color:var(--t);}
.s-arr:disabled{opacity:.3;cursor:default;}
.dots{display:flex;align-items:center;justify-content:center;gap:6px;margin-bottom:12px;}
.dot{width:7px;height:7px;border-radius:50%;background:var(--bd);cursor:pointer;transition:all .2s;}
.dot.on{width:20px;border-radius:4px;background:#dc2743;}
.ai-note{display:flex;align-items:flex-start;gap:9px;padding:12px;margin-bottom:12px;background:#fff8f0;border:1px solid #fddcbc;border-radius:var(--r);font-size:12px;color:#8b5e3c;line-height:1.5;}

/* OVERLAY */
.ov-card{display:none;background:var(--sur);border:1px solid var(--bl);border-radius:var(--rl);overflow:hidden;margin-top:16px;box-shadow:var(--sh);}
.ov-card.on{display:block;animation:up .35s cubic-bezier(.34,1.56,.64,1) both;}
.ov-tabs{display:flex;border-bottom:1px solid var(--bl);}
.ov-tab{flex:1;padding:13px 0;font:600 13px 'DM Sans',sans-serif;color:var(--t2);border:none;background:none;cursor:pointer;border-bottom:2px solid transparent;margin-bottom:-1px;}
.ov-tab.on{color:var(--t);border-bottom-color:var(--t);}
.ov-panel{display:none;padding:16px 20px 0;}
.ov-panel.on{display:block;}
.ov-preview{border-radius:var(--r);overflow:hidden;background:repeating-conic-gradient(#e0e0e0 0% 25%,#f5f5f5 0% 50%) 0 0/12px 12px;display:flex;align-items:center;justify-content:center;margin:16px 20px 12px;cursor:crosshair;touch-action:none;user-select:none;}
#ovCanvas{display:block;max-width:100%;}
.layer-list{margin:0 20px 10px;display:flex;flex-direction:column;gap:6px;max-height:130px;overflow-y:auto;}
.layer-item{display:flex;align-items:center;gap:8px;padding:8px 10px;background:var(--s2);border-radius:var(--r);border:1.5px solid transparent;cursor:pointer;font-size:13px;}
.layer-item.sel{border-color:#dc2743;background:#fff5f6;}
.l-thumb{width:30px;height:30px;border-radius:4px;object-fit:contain;background:#eee;flex-shrink:0;display:flex;align-items:center;justify-content:center;font-size:14px;font-weight:700;}
.l-info{flex:1;min-width:0;}
.l-name{font-weight:600;font-size:12px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.l-sub{font-size:11px;color:var(--t2);}
.l-del{background:none;border:none;cursor:pointer;color:var(--t3);padding:4px;display:flex;align-items:center;}
.l-del:hover{color:var(--red);}
.ctrl-row{display:flex;align-items:center;gap:10px;margin-bottom:10px;padding:0 20px;}
.ctrl-lbl{font-size:12px;font-weight:600;color:var(--t2);width:38px;flex-shrink:0;}
.ctrl-row input[type=range]{flex:1;accent-color:#dc2743;}
.ctrl-row input[type=color]{width:34px;height:30px;border:1.5px solid var(--bd);border-radius:6px;padding:2px;cursor:pointer;background:none;}
.ctrl-row select,.ctrl-row input[type=text]{flex:1;padding:8px 10px;border:1.5px solid var(--bd);border-radius:var(--r);font:500 13px 'DM Sans',sans-serif;color:var(--t);background:var(--s2);outline:none;}
.ctrl-row select:focus,.ctrl-row input[type=text]:focus{border-color:var(--acc);background:#fff;}
.ctrl-val{font-size:11px;color:var(--t3);width:32px;text-align:right;flex-shrink:0;}
.txt-area-wrap{padding:0 20px 10px;}
.txt-area-wrap textarea{width:100%;padding:9px 12px;border:1.5px solid var(--bd);border-radius:var(--r);font:500 14px 'DM Sans',sans-serif;color:var(--t);background:var(--s2);outline:none;resize:vertical;min-height:68px;line-height:1.5;}
.txt-area-wrap textarea:focus{border-color:var(--acc);background:#fff;}
.align-grp{display:flex;gap:4px;}
.align-btn{padding:5px 10px;border:1.5px solid var(--bd);border-radius:6px;background:none;cursor:pointer;font-size:13px;}
.align-btn.on{background:var(--t);color:#fff;border-color:var(--t);}
.btn-add{width:calc(100% - 40px);margin:0 20px 16px;padding:11px;border:2px dashed var(--bd);border-radius:var(--r);background:none;font:600 13px 'DM Sans',sans-serif;color:var(--t2);cursor:pointer;display:flex;align-items:center;justify-content:center;gap:6px;}
.btn-add:hover{border-color:var(--t);color:var(--t);background:var(--s2);}
.btn-add.edit{border-style:solid;border-color:#dc2743;color:#dc2743;background:#fff5f6;}
.ov-dl-row{display:flex;gap:8px;padding:0 20px 20px;}
.img-sel-ctrl{padding:0 20px 10px;display:none;}
.img-sel-ctrl.on{display:block;}

/* TOAST */
.toast{position:fixed;bottom:72px;left:50%;transform:translateX(-50%) translateY(14px);background:var(--t);color:#fff;font-size:13px;font-weight:500;padding:9px 18px;border-radius:28px;opacity:0;pointer-events:none;transition:all .25s cubic-bezier(.34,1.56,.64,1);white-space:nowrap;z-index:999;}
.toast.on{opacity:1;transform:translateX(-50%) translateY(0);}
.hide{display:none!important;}

@media(max-width:480px){
  .wrap{padding:14px 12px 110px;}
  .pg{gap:8px;}
  .dl-row,.ov-dl-row{flex-direction:column;}
}
</style>
</head>
<body>

<header class="hdr">
  <span class="logo">ImageFit</span>
  <button id="resetBtn" onclick="doReset()">초기화</button>
</header>

<div class="wrap">

  <!-- UPLOAD -->
  <div class="up-zone" id="upZone">
    <div class="up-ico">
      <svg viewBox="0 0 24 24" fill="none" stroke="url(#gr)" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
        <defs><linearGradient id="gr" x1="0" y1="0" x2="1" y2="1">
          <stop offset="0%" stop-color="#f09433"/><stop offset="100%" stop-color="#bc1888"/>
        </linearGradient></defs>
        <rect x="3" y="3" width="18" height="18" rx="4"/>
        <circle cx="8.5" cy="8.5" r="1.5"/><polyline points="21 15 16 10 5 21"/>
      </svg>
    </div>
    <p class="up-ttl">이미지를 업로드하세요</p>
    <p class="up-sub">JPG, PNG, WEBP 지원<br>드래그 앤 드롭 또는 클릭</p>
    <button class="up-btn" id="pickBtn">
      <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
        <path d="M21 15v4a2 2 0 01-2 2H5a2 2 0 01-2-2v-4"/><polyline points="17 8 12 3 7 8"/><line x1="12" y1="3" x2="12" y2="15"/>
      </svg>사진 선택
    </button>
  </div>
  <input type="file" id="fi" accept="image/*">

  <!-- STEP CARD -->
  <div class="card hide" id="stepCard">
    <div class="c-hdr">
      <span class="c-ttl"><span class="step-n">1</span>첨부된 이미지</span>
      <button class="lnk" id="changeBtn">변경</button>
    </div>
    <div class="pv-row">
      <img class="pv-thumb" id="pvThumb" src="" alt="">
      <div style="flex:1;min-width:0">
        <p class="pv-name" id="pvName"></p>
        <p class="pv-meta" id="pvMeta"></p>
      </div>
    </div>
    <div style="border-top:1px solid var(--bl)">
      <div class="c-hdr">
        <span class="c-ttl"><span class="step-n">2</span>출력 규격 선택</span>
      </div>
      <div class="preset-wrap">
        <div class="pg">
          <button class="pb" data-w="620" data-h="620" data-limit="1">
            <div class="pb-name">정사각형 소형</div>
            <div class="pb-size">620 × 620 px</div>
            <span class="pb-tag">100KB 이하</span>
          </button>
          <button class="pb" data-w="1000" data-h="1000">
            <div class="pb-name">정사각형 표준</div>
            <div class="pb-size">1000 × 1000 px</div>
          </button>
          <button class="pb" data-w="1080" data-h="1920">
            <div class="pb-name">세로형 스토리</div>
            <div class="pb-size">1080 × 1920 px</div>
          </button>
          <button class="pb" data-w="1200" data-h="1800">
            <div class="pb-name">세로형 와이드</div>
            <div class="pb-size">1200 × 1800 px</div>
          </button>
          <button class="pb" data-custom="1" style="grid-column:1/-1">
            <div class="pb-name">✏️ 직접 입력</div>
            <div class="pb-size">가로 × 세로 직접 지정</div>
          </button>
        </div>
      </div>
      <div class="cust-row" id="custRow">
        <div class="ig"><label>가로 (px)</label><input type="number" id="cw" placeholder="800" min="1" max="8000"></div>
        <div class="sep">×</div>
        <div class="ig"><label>세로 (px)</label><input type="number" id="ch" placeholder="600" min="1" max="8000"></div>
      </div>
    </div>

    <!-- EDITOR SECTION -->
    <div class="ed-sec" id="edSec">
      <div class="c-hdr">
        <span class="c-ttl"><span class="step-n">3</span>위치 조정 <span class="mode-badge" id="modeBadge"></span></span>
        <span style="font-size:12px;color:var(--t2)" id="szLabel"></span>
      </div>
      <div class="hint-bar">
        <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" style="flex-shrink:0;margin-top:1px"><circle cx="12" cy="12" r="10"/><line x1="12" y1="8" x2="12" y2="12"/><line x1="12" y1="16" x2="12.01" y2="16"/></svg>
        <span id="hintTxt"></span>
      </div>
      <div class="cv-outer">
        <div class="cv-wrap" id="cvWrap"><canvas id="ec"></canvas></div>
      </div>
      <div class="ed-foot">
        <button class="btn-ctr" id="centerBtn">
          <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"/><path d="M12 2v3M12 19v3M4.22 4.22l2.12 2.12M17.66 17.66l2.12 2.12M2 12h3M19 12h3M4.22 19.78l2.12-2.12M17.66 6.34l2.12-2.12"/></svg>
          가운데로
        </button>
        <span class="readout" id="readout"></span>
      </div>
      <div class="proc-wrap">
        <button class="btn-proc" id="procBtn">이미지 변환하기</button>
      </div>
    </div>
  </div>

  <!-- PROGRESS -->
  <div class="prog" id="prog">
    <div class="prog-ico">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#dc2743" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="18" height="18" rx="4"/><circle cx="8.5" cy="8.5" r="1.5"/><polyline points="21 15 16 10 5 21"/></svg>
    </div>
    <p class="prog-ttl" id="progTtl">처리 중...</p>
    <p class="prog-sub" id="progSub">잠시만 기다려 주세요</p>
    <div class="prog-bg"><div class="prog-bar" id="progBar"></div></div>
  </div>

  <!-- RESULT -->
  <div class="res-card" id="resCard">
    <div class="c-hdr">
      <span class="c-ttl">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><polyline points="20 6 9 17 4 12"/></svg>
        변환 완료
      </span>
      <span id="resBadge" style="font-size:12px;color:var(--t2)"></span>
    </div>
    <div class="res-body" id="resBody"></div>
  </div>

  <!-- OVERLAY EDITOR -->

    <div class="c-hdr">

        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="18" height="18" rx="3"/><path d="M9 9h6M9 12h6M9 15h4"/></svg>
        이미지 · 텍스트 추가
      </span>

      <button class="ov-tab on" data-tab="tabImg">🖼 이미지 추가</button>

    <!-- IMG TAB -->
    <div class="ov-panel on" id="tabImg">

      <button class="btn-add" id="addImgBtn">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15v4a2 2 0 01-2 2H5a2 2 0 01-2-2v-4"/><polyline points="17 8 12 3 7 8"/><line x1="12" y1="3" x2="12" y2="15"/></svg>
        이미지 파일 선택
      </button>
      <input type="file" id="ovFi" accept="image/*">
    </div>

    <!-- TXT TAB -->
    <div class="ov-panel" id="tabTxt">
      <div id="txtHint" style="font-size:12px;color:var(--t2);margin-bottom:12px;padding:10px;background:var(--s2);border-radius:var(--r)">텍스트를 입력하고 추가하세요. 엔터로 줄바꿈 가능합니다.</div>
      <div class="txt-area-wrap">
        <textarea id="txtContent" placeholder="텍스트 입력&#10;엔터로 줄바꿈" rows="3"></textarea>
      </div>
      <div class="ctrl-row">
        <span class="ctrl-lbl">폰트</span>
        <select id="txtFont">
          <option value="'DM Sans',sans-serif">DM Sans</option>
          <option value="Georgia,serif">Georgia (명조)</option>
          <option value="'Courier New',monospace">Courier</option>
          <option value="Impact,sans-serif">Impact (굵은)</option>
        </select>
      </div>
      <div class="ctrl-row">
        <span class="ctrl-lbl">크기</span>
        <input type="range" id="txtSize" min="10" max="300" value="48">
        <span class="ctrl-val" id="txtSizeV">48px</span>
      </div>
      <div class="ctrl-row">
        <span class="ctrl-lbl">색상</span>
        <input type="color" id="txtColor" value="#ffffff">
        <span style="font-size:12px;color:var(--t2);margin-left:4px">테두리</span>
        <input type="color" id="txtStroke" value="#000000">
        <input type="range" id="txtStrokeW" min="0" max="20" value="0" style="width:55px">

        <span class="ctrl-val" id="txtOpV">100%</span>

        <button class="btn-add" id="addTxtBtn" style="margin:0;flex:1">

          텍스트 추가
        </button>
        <button id="delTxtBtn" style="display:none;flex:none;padding:11px 14px;border:2px solid var(--red);border-radius:var(--r);background:none;font:600 13px 'DM Sans',sans-serif;color:var(--red);cursor:pointer">삭제</button>

    <!-- SHARED: preview + layer list + img controls + download -->
    <div class="ov-preview" id="ovPreview"><canvas id="ovCanvas"></canvas></div>
    <div class="layer-list" id="layerList"></div>

    <!-- Image layer controls -->
    <div class="img-sel-ctrl" id="imgCtrl">
      <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:10px;padding:0 20px">
        <span style="font-size:13px;font-weight:600">🖼 이미지 레이어</span>
        <button id="delImgBtn" style="background:none;border:none;cursor:pointer;font:600 12px 'DM Sans',sans-serif;color:var(--red)">삭제</button>
      </div>
      <div class="ctrl-row">
        <span class="ctrl-lbl">크기</span>
        <input type="range" id="imgScale" min="5" max="300" value="100">
        <span class="ctrl-val" id="imgScaleV">100%</span>
      </div>
      <div class="ctrl-row">
        <span class="ctrl-lbl">투명도</span>
        <input type="range" id="imgOp" min="10" max="100" value="100">
        <span class="ctrl-val" id="imgOpV">100%</span>
      </div>
    </div>

    <div class="ov-dl-row">
      <button class="btn-dl" onclick="dlOverlay('image/jpeg')">
        <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15v4a2 2 0 01-2 2H5a2 2 0 01-2-2v-4"/><polyline points="17 8 12 13 7 8"/><line x1="12" y1="3" x2="12" y2="13"/></svg>JPG 저장
      </button>
      <button class="btn-dl pri" onclick="dlOverlay('image/png')">
        <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15v4a2 2 0 01-2 2H5a2 2 0 01-2-2v-4"/><polyline points="17 8 12 13 7 8"/><line x1="12" y1="3" x2="12" y2="13"/></svg>PNG 저장
      </button>
    </div>
  </div>

</div>
<div class="toast" id="toast"></div>

<script>
'use strict';

// ─── STATE ───────────────────────────────────────
const S = {
  file:null, img:null, iw:0, ih:0,
  tw:0, th:0, limit:false,
  mode:'', // 'crop'|'expand'
  // position editor
  MAX:320, dw:0, dh:0, ds:1,
  ix:0, iy:0,
  sw:0, sh:0,   // crop: scaled display size
  uw:0, uh:0,   // expand: upscaled display size
  urw:0, urh:0, // expand: upscaled real size
  // editor drag
  dragging:false, dsx:0, dsy:0, dix:0, diy:0,
  // results
  selIdx:0,
  // overlay
  ovBase:null, ovLayers:[], ovSel:-1,
  ovDW:0, ovDH:0, ovScale:1,
  ovDrag:false, ovResize:false, ovCorner:'',
  ovDSX:0, ovDSY:0, ovDLX:0, ovDLY:0,
  ovOrigW:0, ovOrigH:0, ovOrigX:0, ovOrigY:0,
  txtMode:'new', // 'new' or layer index
  compBlob:null, jpgQ:0.92,
};
const isMobile = /iPhone|iPad|iPod|Android/i.test(navigator.userAgent);

// ─── UPLOAD ──────────────────────────────────────
function initUpload(){
  const zone = document.getElementById('upZone');
  const fi   = document.getElementById('fi');

  // file input change
  fi.addEventListener('change', e => {
    if(e.target.files[0]) loadFile(e.target.files[0]);
    fi.value = '';
  });

  // click zone or pick button
  zone.addEventListener('click', () => fi.click());
  document.getElementById('pickBtn').addEventListener('click', e => { e.stopPropagation(); fi.click(); });
  document.getElementById('changeBtn').addEventListener('click', () => fi.click());

  // drag & drop — block entire document
  ['dragenter','dragover','dragleave','drop'].forEach(ev =>
    document.addEventListener(ev, e => { e.preventDefault(); e.stopPropagation(); }, false)
  );
  document.addEventListener('dragenter', () => zone.classList.add('drag'));
  document.addEventListener('dragleave', e => {
    if(!e.relatedTarget || e.relatedTarget === document.documentElement)
      zone.classList.remove('drag');
  });
  document.addEventListener('drop', e => {
    zone.classList.remove('drag');
    const f = e.dataTransfer?.files?.[0];
    if(f && f.type.startsWith('image/')) loadFile(f);
    else if(f) showToast('이미지 파일만 업로드 가능합니다');
  });
}

function loadFile(file){
  S.file = file;
  const reader = new FileReader();
  reader.onload = ev => {
    const img = new Image();
    img.onload = () => {
      S.img = img; S.iw = img.width; S.ih = img.height;
      S.compBlob = null; S.jpgQ = 0.92;
      showFileInfo();
    };
    img.src = ev.target.result;
  };
  reader.readAsDataURL(file);
}

function showFileInfo(){
  const r = new FileReader();
  r.onload = e => document.getElementById('pvThumb').src = e.target.result;
  r.readAsDataURL(S.file);
  document.getElementById('pvName').textContent = S.file.name;
  document.getElementById('pvMeta').innerHTML = `${S.iw} × ${S.ih} px &nbsp;·&nbsp; ${(S.file.size/1024).toFixed(0)} KB`;
  document.getElementById('stepCard').classList.remove('hide');
  document.getElementById('upZone').style.display = 'none';
  document.getElementById('resetBtn').classList.add('on');
  document.getElementById('edSec').classList.remove('on');
  hideRes(); hideProg(); hideOv();
  clearPresets();
}

// ─── PRESETS ─────────────────────────────────────
function initPresets(){
  document.querySelectorAll('.pb').forEach(btn => {
    btn.addEventListener('click', () => {
      document.querySelectorAll('.pb').forEach(b => b.classList.remove('on'));
      btn.classList.add('on');
      if(btn.dataset.custom){
        document.getElementById('custRow').classList.add('on');
        updateCustom();
      } else {
        document.getElementById('custRow').classList.remove('on');
        S.tw = +btn.dataset.w;
        S.th = +btn.dataset.h;
        S.limit = !!btn.dataset.limit;
        buildEditor();
      }
    });
  });
  document.getElementById('cw').addEventListener('input', updateCustom);
  document.getElementById('ch').addEventListener('input', updateCustom);
}
function clearPresets(){
  document.querySelectorAll('.pb').forEach(b => b.classList.remove('on'));
  document.getElementById('custRow').classList.remove('on');
  S.tw=0; S.th=0; S.limit=false;
  document.getElementById('edSec').classList.remove('on');
}
function updateCustom(){
  S.tw = parseInt(document.getElementById('cw').value)||0;
  S.th = parseInt(document.getElementById('ch').value)||0;
  S.limit = false;
  if(S.tw>0 && S.th>0) buildEditor();
  else document.getElementById('edSec').classList.remove('on');
}

// ─── POSITION EDITOR ─────────────────────────────
function buildEditor(){
  if(!S.img || !S.tw || !S.th) return;
  S.mode = (S.iw < S.tw || S.ih < S.th) ? 'expand' : 'crop';
  const badge = document.getElementById('modeBadge');
  if(S.mode === 'crop'){
    badge.textContent='✂️ 크롭'; badge.className='mode-badge crop-b';
    document.getElementById('hintTxt').textContent='드래그하여 살릴 영역을 조정하세요. 어두운 부분이 잘려나갑니다.';
  } else {
    badge.textContent='⬜ 배경 확장'; badge.className='mode-badge exp-b';
    document.getElementById('hintTxt').textContent='드래그하여 원본 이미지 위치를 조정하세요. 빈 영역은 선택한 배경으로 채워집니다.';
  }
  document.getElementById('szLabel').textContent = `${S.tw} × ${S.th} px`;

  const asp = S.tw/S.th;
  if(asp>=1){ S.dw=S.MAX; S.dh=Math.round(S.MAX/asp); }
  else       { S.dh=S.MAX; S.dw=Math.round(S.MAX*asp); }
  S.ds = S.tw/S.dw;

  const cv = document.getElementById('ec');
  cv.width=S.dw; cv.height=S.dh;
  cv.style.width=S.dw+'px'; cv.style.height=S.dh+'px';

  if(S.mode==='crop'){
    const sc = Math.max(S.tw/S.iw, S.th/S.ih);
    S.sw = Math.round(S.iw*sc/S.ds);
    S.sh = Math.round(S.ih*sc/S.ds);
    S.ix = Math.round((S.dw-S.sw)/2);
    S.iy = Math.round((S.dh-S.sh)/2);
  } else {
    const sc = Math.min(Math.max(S.tw/S.iw, S.th/S.ih), 1.5);
    S.urw=Math.round(S.iw*sc); S.urh=Math.round(S.ih*sc);
    S.uw=Math.round(S.urw/S.ds); S.uh=Math.round(S.urh/S.ds);
    S.ix=Math.round((S.dw-S.uw)/2); S.iy=Math.round((S.dh-S.uh)/2);
  }
  drawEditor(); updateReadout();
  document.getElementById('edSec').classList.add('on');
  setTimeout(()=>document.getElementById('edSec').scrollIntoView({behavior:'smooth',block:'nearest'}),60);
}

function drawEditor(){
  const cv=document.getElementById('ec'), ctx=cv.getContext('2d');
  ctx.clearRect(0,0,S.dw,S.dh);
  if(S.mode==='crop'){
    ctx.drawImage(S.img,S.ix,S.iy,S.sw,S.sh);
    ctx.fillStyle='rgba(0,0,0,.5)';
    if(S.iy>0) ctx.fillRect(0,0,S.dw,S.iy);
    const ib=S.iy+S.sh; if(ib<S.dh) ctx.fillRect(0,ib,S.dw,S.dh-ib);
    if(S.ix>0) ctx.fillRect(0,S.iy,S.ix,S.sh);
    const ir=S.ix+S.sw; if(ir<S.dw) ctx.fillRect(ir,S.iy,S.dw-ir,S.sh);
    ctx.strokeStyle='rgba(255,255,255,.85)'; ctx.lineWidth=2; ctx.setLineDash([]);
    ctx.strokeRect(1,1,S.dw-2,S.dh-2);
    ctx.strokeStyle='rgba(255,255,255,.2)'; ctx.lineWidth=1; ctx.setLineDash([3,3]);
    for(let i=1;i<3;i++){
      ctx.beginPath();ctx.moveTo(S.dw*i/3,0);ctx.lineTo(S.dw*i/3,S.dh);ctx.stroke();
      ctx.beginPath();ctx.moveTo(0,S.dh*i/3);ctx.lineTo(S.dw,S.dh*i/3);ctx.stroke();
    }
    ctx.setLineDash([]);
  } else {
    const ps=9;
    for(let py=0;py<S.dh;py+=ps) for(let px=0;px<S.dw;px+=ps){
      ctx.fillStyle=((Math.floor(px/ps)+Math.floor(py/ps))%2===0)?'#ddd':'#c8c8c8';
      ctx.fillRect(px,py,ps,ps);
    }
    ctx.save();ctx.globalAlpha=.13;ctx.fillStyle='#8b5cf6';ctx.fillRect(0,0,S.dw,S.dh);ctx.restore();
    ctx.drawImage(S.img,S.ix,S.iy,S.uw,S.uh);
    ctx.strokeStyle='rgba(139,92,246,.75)';ctx.lineWidth=1.5;ctx.setLineDash([5,3]);
    ctx.strokeRect(S.ix+1,S.iy+1,S.uw-2,S.uh-2);ctx.setLineDash([]);
    ctx.fillStyle='rgba(139,92,246,.8)';ctx.font='bold 10px sans-serif';ctx.textAlign='center';
    const gT=S.iy,gB=S.dh-S.iy-S.uh,gL=S.ix,gR=S.dw-S.ix-S.uw;
    if(gT>16) ctx.fillText('배경 채움',S.dw/2,gT/2+5);
    if(gB>16) ctx.fillText('배경 채움',S.dw/2,S.iy+S.uh+gB/2+5);
  }
}
function updateReadout(){
  let t='';
  if(S.mode==='crop') t=`X: ${Math.round(-S.ix*S.ds)}px  Y: ${Math.round(-S.iy*S.ds)}px`;
  else t=`X: ${Math.round(S.ix*S.ds)}px  Y: ${Math.round(S.iy*S.ds)}px`;
  document.getElementById('readout').textContent=t;
}

function initEditorDrag(){
  const wrap=document.getElementById('cvWrap');
  wrap.addEventListener('mousedown',edDragStart);
  wrap.addEventListener('touchstart',e=>{e.preventDefault();edDragStart(e.touches[0]);},{passive:false});
  window.addEventListener('mousemove',e=>{if(S.dragging)edDragMove(e);});
  window.addEventListener('mouseup',()=>{ S.dragging=false; document.getElementById('cvWrap').classList.remove('grabbing'); });
  window.addEventListener('touchmove',e=>{if(S.dragging){e.preventDefault();edDragMove(e.touches[0]);}},{passive:false});
  window.addEventListener('touchend',()=>{ S.dragging=false; });
  document.getElementById('centerBtn').addEventListener('click',()=>{
    if(S.mode==='crop'){S.ix=Math.round((S.dw-S.sw)/2);S.iy=Math.round((S.dh-S.sh)/2);}
    else{S.ix=Math.round((S.dw-S.uw)/2);S.iy=Math.round((S.dh-S.uh)/2);}
    drawEditor();updateReadout();
  });
}
function edPt(e){
  const r=document.getElementById('ec').getBoundingClientRect();
  return{x:e.clientX-r.left,y:e.clientY-r.top};
}
function edDragStart(e){
  S.dragging=true;
  document.getElementById('cvWrap').classList.add('grabbing');
  const p=edPt(e);
  S.dsx=p.x*S.ds; S.dsy=p.y*S.ds;
  S.dix=S.ix; S.diy=S.iy;
}
function edDragMove(e){
  const p=edPt(e);
  const dx=p.x*S.ds-S.dsx, dy=p.y*S.ds-S.dsy;
  const ddx=dx/S.ds, ddy=dy/S.ds;
  if(S.mode==='crop'){
    S.ix=Math.min(0,Math.max(S.dw-S.sw,S.dix+ddx));
    S.iy=Math.min(0,Math.max(S.dh-S.sh,S.diy+ddy));
  } else {
    const mg=28;
    S.ix=Math.min(S.dw-mg,Math.max(mg-S.uw,S.dix+ddx));
    S.iy=Math.min(S.dh-mg,Math.max(mg-S.uh,S.diy+ddy));
  }
  drawEditor();updateReadout();
}

// ─── PROCESS ─────────────────────────────────────
function initProcess(){
  document.getElementById('procBtn').addEventListener('click',doProcess);
}
async function doProcess(){
  hideRes(); hideProg(); hideOv();
  document.getElementById('stepCard').classList.add('hide');
  showProg('분석 중…','잠시만 기다려 주세요');
  if(S.mode==='crop') await runCrop();
  else await runExpand();
}

async function runCrop(){
  setProg(30,'크기 조정 중…',''); await sleep(300);
  const sc=Math.max(S.tw/S.iw,S.th/S.ih);
  const rW=Math.round(S.iw*sc), rH=Math.round(S.ih*sc);
  const rX=Math.round(S.ix*S.ds), rY=Math.round(S.iy*S.ds);
  const cv=mkCanvas(S.tw,S.th);
  cv.getContext('2d').drawImage(S.img,rX,rY,rW,rH);
  setProg(80,'마무리 중…',''); await sleep(200);
  let note='';
  if(S.limit){
    setProg(88,'100KB 이하 압축 중…','');
    await compress100kb(cv);
    const kb=S.compBlob?Math.round(S.compBlob.size/1024):0;
    note=`100KB 이하 압축 완료 (${kb}KB)`;
  }
  setProg(100,'완료!',''); await sleep(280);
  showSingle(cv,note);
}

async function runExpand(){
  setProg(20,'이미지 처리 중…','3가지 옵션을 생성합니다'); await sleep(300);

  const posX=Math.round(S.ix*S.ds), posY=Math.round(S.iy*S.ds);

  // 원본 이미지를 위치 기준으로 업스케일 (현재 편집기 설정대로)
  const src=mkCanvas(S.urw,S.urh);
  src.getContext('2d').drawImage(S.img,0,0,S.urw,S.urh);

  setProg(50,'배경 옵션 생성 중…','');  await sleep(300);

  const results=[
    makeStretch(posX,posY),           // 강제확장 (비율 무시)
    localFill(src,S.urw,S.urh,posX,posY,'white'),   // 흰 배경
    localFill(src,S.urw,S.urh,posX,posY,'color'),   // 색상 채우기
  ];

  setProg(100,'완료!',''); await sleep(200);
  hideProg(); showMany(results);
}

// 강제확장: 비율 유지하며 빈 공간 없이 타겟을 완전히 채움 (150% 제한 없음, 넘치는 부분 크롭)
function makeStretch(posX,posY){
  const cv=mkCanvas(S.tw,S.th);
  const ctx=cv.getContext('2d');

  // cover: 타겟을 완전히 덮을 때까지 키움
  const scale=Math.max(S.tw/S.img.width, S.th/S.img.height);
  const scaledW=Math.round(S.img.width*scale);
  const scaledH=Math.round(S.img.height*scale);

  // 가운데 정렬 (넘치는 부분은 canvas 밖으로 → 자동 크롭)
  const dx=Math.round((S.tw-scaledW)/2);
  const dy=Math.round((S.th-scaledH)/2);

  ctx.drawImage(S.img,dx,dy,scaledW,scaledH);
  return{canvas:cv,label:'강제 확장'};
}

// ─── AI ──────────────────────────────────────────
function localFill(src,sw,sh,pX,pY,mode){
  const cv=mkCanvas(S.tw,S.th); const ctx=cv.getContext('2d');

  if(mode==='white'){
    // 흰 배경
    ctx.fillStyle='#ffffff';
    ctx.fillRect(0,0,S.tw,S.th);
    ctx.drawImage(src,pX,pY,sw,sh);

  } else if(mode==='color'){
    // 엣지 픽셀 평균 색상으로 배경 채우기
    const srcCtx=src.getContext('2d');
    const samples=[];
    const edge=4; // 엣지 샘플 두께
    [
      [0,0,sw,edge],           // 위
      [0,sh-edge,sw,edge],     // 아래
      [0,0,edge,sh],           // 왼쪽
      [sw-edge,0,edge,sh],     // 오른쪽
    ].forEach(([x,y,w,h])=>{
      try{
        const data=srcCtx.getImageData(x,y,Math.max(1,w),Math.max(1,h)).data;
        for(let i=0;i<data.length;i+=4*8) // 8픽셀 간격으로 샘플
          samples.push([data[i],data[i+1],data[i+2]]);
      }catch(e){}
    });
    const len=Math.max(1,samples.length);
    const avg=samples.reduce((a,c)=>[a[0]+c[0],a[1]+c[1],a[2]+c[2]],[0,0,0])
                     .map(v=>Math.round(v/len));
    ctx.fillStyle=`rgb(${avg[0]},${avg[1]},${avg[2]})`;
    ctx.fillRect(0,0,S.tw,S.th);
    ctx.drawImage(src,pX,pY,sw,sh);
  }

  return{
    canvas:cv,
    label: mode==='white'?'흰 배경':'색상 채우기'
  };
}

// ─── COMPRESS ────────────────────────────────────
async function compress100kb(cv){
  let q=0.92, blob=null;
  for(let i=0;i<15;i++){
    blob=await new Promise(r=>cv.toBlob(r,'image/jpeg',q));
    if(blob.size<=102400) break;
    q=Math.max(0.05, q*(102400/blob.size)*0.95);
  }
  S.compBlob=blob; S.jpgQ=q;
}

// ─── SAVE ────────────────────────────────────────
async function saveImg(cv,fmt){
  const type='image/'+fmt, ext=fmt==='jpeg'?'jpg':fmt;
  const filename=`imagefit_${S.tw}x${S.th}.${ext}`;
  let blob;
  if(S.limit && fmt==='jpeg' && S.compBlob){ blob=S.compBlob; }
  else { blob=await new Promise(r=>cv.toBlob(r,type,fmt==='jpeg'?(S.limit?S.jpgQ:0.95):0.95)); }
  if(!blob){ showToast('저장 실패'); return; }
  const url=URL.createObjectURL(blob);
  const a=document.createElement('a'); a.href=url; a.download=filename;
  document.body.appendChild(a); a.click();
  setTimeout(()=>{ URL.revokeObjectURL(url); a.remove(); },2000);
  if(isMobile){
    if(/iPhone|iPad|iPod/i.test(navigator.userAgent)){
      setTimeout(()=>{
        if(confirm('사진첩에 저장하려면 확인을 누르세요.\n(이미지가 새 탭에서 열립니다 → 길게 눌러 저장)'))
          window.open(url,'_blank');
      },800);
    } else { showToast('📥 다운로드 후 갤러리에서 확인하세요'); }
  } else { showToast(`✅ ${filename} 저장됩니다`); }
}

// ─── OVERLAY ─────────────────────────────────────
function initOverlay(){
  const base=S.ovBase; if(!base) return;
  const oc=document.getElementById('ovCard');
  oc.style.display='block'; oc.classList.add('on');
  const avail=oc.clientWidth-40;
  const maxW=Math.max(200,Math.min(540,avail));
  const maxH=Math.min(window.innerHeight*.6,500);
  const asp=base.width/base.height;
  if(asp>=1){ S.ovDW=maxW; S.ovDH=Math.round(maxW/asp); if(S.ovDH>maxH){S.ovDH=maxH;S.ovDW=Math.round(maxH*asp);} }
  else       { S.ovDH=maxH; S.ovDW=Math.round(maxH*asp); if(S.ovDW>maxW){S.ovDW=maxW;S.ovDH=Math.round(maxW/asp);} }
  S.ovScale=base.width/S.ovDW;
  const cv=document.getElementById('ovCanvas');
  cv.width=S.ovDW; cv.height=S.ovDH;
  cv.style.width=S.ovDW+'px'; cv.style.height=S.ovDH+'px';
  requestAnimationFrame(()=>{ ovRedraw(); setTimeout(()=>oc.scrollIntoView({behavior:'smooth',block:'nearest'}),80); });
}

function ovRedraw(){
  const cv=document.getElementById('ovCanvas'); if(!cv||!S.ovBase) return;
  if(cv.width<=0||cv.height<=0) return;
  const ctx=cv.getContext('2d');
  ctx.clearRect(0,0,cv.width,cv.height);
  ctx.drawImage(S.ovBase,0,0,cv.width,cv.height);
  S.ovLayers.forEach((l,i)=>{ drawLayer(ctx,l,i===S.ovSel); });
}
function drawLayer(ctx,l,sel){
  ctx.save(); ctx.globalAlpha=l.opacity??1;
  if(l.type==='img'){
    const dx=l.x/S.ovScale,dy=l.y/S.ovScale,dw=l.w/S.ovScale,dh=l.h/S.ovScale;
    ctx.drawImage(l.img,dx,dy,dw,dh);
    if(sel){ ctx.globalAlpha=1; drawSelBox(ctx,{dx,dy,dw,dh}); }
  } else {
    const lines=(l.content||'').split('\n');
    const fs=Math.max(3,l.size/S.ovScale);
    const lh=fs*1.35;
    ctx.font=`bold ${fs}px ${l.font||'sans-serif'}`;
    ctx.textBaseline='top';
    const tx=l.x/S.ovScale, ty=l.y/S.ovScale;
    lines.forEach((line,li)=>{
      const lw=ctx.measureText(line).width;
      const lx=l.align==='center'?tx-lw/2:l.align==='right'?tx-lw:tx;
      const ly=ty+li*lh;
      if(l.strokeW>0){
        ctx.strokeStyle=l.stroke||'#000';ctx.lineWidth=l.strokeW/S.ovScale*2;ctx.lineJoin='round';
        ctx.strokeText(line,lx,ly);
      }
      ctx.fillStyle=l.color||'#fff'; ctx.fillText(line,lx,ly);
    });
    if(sel){ ctx.globalAlpha=1; const r=getTxtRect(l); drawSelBox(ctx,r); }
  }
  ctx.restore();
}
const HNDL=9;
function drawSelBox(ctx,r){
  ctx.strokeStyle='#dc2743';ctx.lineWidth=1.5;ctx.setLineDash([4,3]);
  ctx.strokeRect(r.dx,r.dy,r.dw,r.dh);ctx.setLineDash([]);
  [[r.dx,r.dy],[r.dx+r.dw,r.dy],[r.dx,r.dy+r.dh],[r.dx+r.dw,r.dy+r.dh]].forEach(([hx,hy])=>{
    ctx.fillStyle='#fff';ctx.beginPath();ctx.arc(hx,hy,HNDL,0,Math.PI*2);ctx.fill();
    ctx.strokeStyle='#dc2743';ctx.lineWidth=2;ctx.beginPath();ctx.arc(hx,hy,HNDL,0,Math.PI*2);ctx.stroke();
  });
}
function getTxtRect(l){
  const cv=document.getElementById('ovCanvas');
  const ctx=cv.getContext('2d');
  const fs=Math.max(3,l.size/S.ovScale);
  ctx.font=`bold ${fs}px ${l.font||'sans-serif'}`;
  const lines=(l.content||'').split('\n');
  const mw=Math.max(...lines.map(ln=>ctx.measureText(ln).width));
  const th=fs*1.35*lines.length;
  const tx=l.x/S.ovScale, ty=l.y/S.ovScale;
  const ox=l.align==='center'?tx-mw/2:l.align==='right'?tx-mw:tx;
  return{dx:ox-5,dy:ty-5,dw:mw+10,dh:th+10};
}
function getRect(l){
  if(l.type==='img') return{dx:l.x/S.ovScale,dy:l.y/S.ovScale,dw:l.w/S.ovScale,dh:l.h/S.ovScale};
  return getTxtRect(l);
}
function hitCorner(r,px,py){
  const corners={tl:[r.dx,r.dy],tr:[r.dx+r.dw,r.dy],bl:[r.dx,r.dy+r.dh],br:[r.dx+r.dw,r.dy+r.dh]};
  for(const[k,[cx,cy]] of Object.entries(corners))
    if(Math.abs(px-cx)<=HNDL+3&&Math.abs(py-cy)<=HNDL+3) return k;
  return null;
}
function hitLayer(dpx,dpy){
  for(let i=S.ovLayers.length-1;i>=0;i--){
    const r=getRect(S.ovLayers[i]);
    if(dpx>=r.dx&&dpx<=r.dx+r.dw&&dpy>=r.dy&&dpy<=r.dy+r.dh) return i;
  }
  return -1;
}

function initOverlayEvents(){
  const cv=document.getElementById('ovCanvas');
  cv.addEventListener('mousedown',ovDragStart);
  cv.addEventListener('touchstart',e=>{e.preventDefault();ovDragStart(e.touches[0]);},{passive:false});
  window.addEventListener('mousemove',e=>{if(S.ovDrag||S.ovResize)ovDragMove(e);});
  window.addEventListener('mouseup',ovDragEnd);
  window.addEventListener('touchmove',e=>{if(S.ovDrag||S.ovResize){e.stopPropagation();ovDragMove(e.touches[0]);}},{passive:false});
  window.addEventListener('touchend',ovDragEnd);
}
function ovPt(e){
  const r=document.getElementById('ovCanvas').getBoundingClientRect();
  return{x:e.clientX-r.left,y:e.clientY-r.top};
}
function ovDragStart(e){
  const dp=ovPt(e);
  if(S.ovSel>=0&&S.ovSel<S.ovLayers.length){
    const r=getRect(S.ovLayers[S.ovSel]);
    const corner=hitCorner(r,dp.x,dp.y);
    if(corner){
      S.ovResize=true; S.ovCorner=corner;
      S.ovDSX=dp.x; S.ovDSY=dp.y;
      const l=S.ovLayers[S.ovSel];
      S.ovOrigW=l.type==='img'?l.w/S.ovScale:l.size/S.ovScale;
      S.ovOrigH=l.type==='img'?l.h/S.ovScale:l.size/S.ovScale;
      S.ovOrigX=r.dx; S.ovOrigY=r.dy;
      return;
    }
  }
  const hit=hitLayer(dp.x,dp.y);
  if(hit>=0){
    selectLayer(hit);
    S.ovDrag=true;
    S.ovDSX=dp.x*S.ovScale; S.ovDSY=dp.y*S.ovScale;
    S.ovDLX=S.ovLayers[hit].x; S.ovDLY=S.ovLayers[hit].y;
  } else {
    S.ovSel=-1; setTxtMode('new');
    renderLayers(); updateImgCtrl(); ovRedraw();
  }
}
function ovDragMove(e){
  const dp=ovPt(e);
  if(S.ovResize){
    const ddx=dp.x-S.ovDSX;
    const l=S.ovLayers[S.ovSel]; if(!l) return;
    if(l.type==='img'){
      const asp=S.ovOrigW/Math.max(1,S.ovOrigH);
      const newDW=(S.ovCorner==='br'||S.ovCorner==='tr')?Math.max(8,S.ovOrigW+ddx):Math.max(8,S.ovOrigW-ddx);
      const newDH=newDW/asp;
      l.w=Math.round(newDW*S.ovScale); l.h=Math.round(newDH*S.ovScale);
      if(S.ovCorner==='bl'||S.ovCorner==='tl') l.x=Math.round((S.ovOrigX+S.ovOrigW-newDW)*S.ovScale);
      if(S.ovCorner==='tr'||S.ovCorner==='tl') l.y=Math.round((S.ovOrigY+S.ovOrigH-newDH)*S.ovScale);
    } else {
      const delta=(S.ovCorner==='br'||S.ovCorner==='tr')?ddx:-ddx;
      l.size=Math.max(4,(S.ovOrigW+delta)*S.ovScale);
    }
    ovRedraw(); return;
  }
  if(S.ovDrag){
    const l=S.ovLayers[S.ovSel]; if(!l) return;
    l.x=S.ovDLX+(dp.x*S.ovScale-S.ovDSX);
    l.y=S.ovDLY+(dp.y*S.ovScale-S.ovDSY);
    ovRedraw();
  }
}
function ovDragEnd(){
  if(S.ovResize&&S.ovSel>=0&&S.ovLayers[S.ovSel]?.type==='txt'){
    const sz=Math.round(S.ovLayers[S.ovSel].size);
    document.getElementById('txtSize').value=sz;
    document.getElementById('txtSizeV').textContent=sz+'px';
  }
  S.ovDrag=false; S.ovResize=false; S.ovCorner='';
  updateImgCtrl();
}

function initOverlayUI(){
  // tabs
  document.querySelectorAll('.ov-tab').forEach(btn=>{
    btn.addEventListener('click',()=>{
      document.querySelectorAll('.ov-tab').forEach(t=>t.classList.remove('on'));
      document.querySelectorAll('.ov-panel').forEach(p=>p.classList.remove('on'));
      btn.classList.add('on');
      document.getElementById(btn.dataset.tab).classList.add('on');
    });
  });
  // add image
  const ovFi=document.getElementById('ovFi');
  document.getElementById('addImgBtn').addEventListener('click',()=>{ovFi.value='';ovFi.click();});
  ovFi.addEventListener('change',e=>{
    const f=e.target.files[0]; if(!f) return;
    const r=new FileReader();
    r.onload=ev=>{
      const img=new Image();
      img.onload=()=>{
        const w=Math.round(S.ovBase.width*.3);
        const h=Math.round(img.height*(w/img.width));
        S.ovLayers.push({type:'img',img,name:f.name,
          x:Math.round((S.ovBase.width-w)/2),y:Math.round((S.ovBase.height-h)/2),
          w,h,opacity:1,scaleVal:100});
        S.ovSel=S.ovLayers.length-1;
        renderLayers();updateImgCtrl();ovRedraw();
      };
      img.src=ev.target.result;
    };
    r.readAsDataURL(f); ovFi.value='';
  });
  // txt controls live sync
  ['txtContent','txtFont','txtColor','txtStroke'].forEach(id=>{
    document.getElementById(id).addEventListener('input',syncTxtLayer);
    document.getElementById(id).addEventListener('change',syncTxtLayer);
  });
  document.getElementById('txtSize').addEventListener('input',function(){
    document.getElementById('txtSizeV').textContent=this.value+'px'; syncTxtLayer();
  });
  document.getElementById('txtStrokeW').addEventListener('input',function(){
    document.getElementById('txtSWV').textContent=this.value; syncTxtLayer();
  });
  document.getElementById('txtOpacity').addEventListener('input',function(){
    document.getElementById('txtOpV').textContent=this.value+'%'; syncTxtLayer();
  });
  document.querySelectorAll('.align-btn').forEach(btn=>{
    btn.addEventListener('click',()=>{
      document.querySelectorAll('.align-btn').forEach(b=>b.classList.remove('on'));
      btn.classList.add('on'); syncTxtLayer();

  });
  // add/commit text
  document.getElementById('addTxtBtn').addEventListener('click',commitTxt);
  document.getElementById('delTxtBtn').addEventListener('click',()=>removeLayer(S.ovSel));
  document.getElementById('delImgBtn').addEventListener('click',()=>removeLayer(S.ovSel));
  // img controls
  document.getElementById('imgScale').addEventListener('input',function(){
    const v=+this.value, l=S.ovLayers[S.ovSel]; if(!l||l.type!=='img') return;
    const ratio=v/(l.scaleVal||100);
    l.scaleVal=v; l.w=Math.round(l.w*ratio); l.h=Math.round(l.h*ratio);
    document.getElementById('imgScaleV').textContent=Math.round(v)+'%';
    ovRedraw();
  });
  document.getElementById('imgOp').addEventListener('input',function(){
    const l=S.ovLayers[S.ovSel]; if(!l) return;
    l.opacity=this.value/100;
    document.getElementById('imgOpV').textContent=this.value+'%';
    ovRedraw();
  });
}

function getTxtVals(){

function setTxtVals(l){

function setTxtMode(mode){
  S.txtMode=mode;
  const isEdit=typeof mode==='number';
  const addBtn=document.getElementById('addTxtBtn');
  addBtn.innerHTML=isEdit
    ?'<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><polyline points="20 6 9 17 4 12"/></svg> 수정 완료'
    :'<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg> 텍스트 추가';
  addBtn.className='btn-add'+(isEdit?' edit':'');
  document.getElementById('delTxtBtn').style.display=isEdit?'inline-block':'none';
  document.getElementById('txtHint').textContent=isEdit
    ?'선택된 텍스트를 수정 중입니다. 수정 완료를 누르거나 다른 레이어를 선택하세요.'
    :'텍스트를 입력하고 추가하세요. 엔터로 줄바꿈 가능합니다.';
}
function syncTxtLayer(){
  if(typeof S.txtMode==='number'){
    const l=S.ovLayers[S.txtMode]; if(!l||l.type!=='txt') return;
    Object.assign(l,getTxtVals());
    l.name=makeTxtName(l.content);
    renderLayers(); ovRedraw();
  }
}
function commitTxt(){
  if(typeof S.txtMode==='number'){ setTxtMode('new'); S.ovSel=-1; updateImgCtrl(); ovRedraw(); return; }
  const v=getTxtVals();
  if(!v.content.trim()){ showToast('텍스트를 입력해주세요'); return; }
  S.ovLayers.push({type:'txt',name:makeTxtName(v.content),
    x:Math.round(S.ovBase.width/2),y:Math.round(S.ovBase.height/2),
    scaleVal:100,...v});
  S.ovSel=S.ovLayers.length-1;
  renderLayers(); ovRedraw(); updateImgCtrl();
}
function makeTxtName(c){ const s=(c||'').replace(/\n/g,' '); return`"${s.slice(0,14)}${s.length>14?'…':''}"` }

function selectLayer(i){
  S.ovSel=i;
  const l=S.ovLayers[i];
  renderLayers(); ovRedraw();
  if(l.type==='txt'){
    document.querySelectorAll('.ov-tab').forEach(t=>t.classList.remove('on'));
    document.querySelectorAll('.ov-panel').forEach(p=>p.classList.remove('on'));
    document.querySelector('[data-tab="tabTxt"]').classList.add('on');
    document.getElementById('tabTxt').classList.add('on');
    setTxtVals(l); setTxtMode(i);
  } else {
    setTxtMode('new');
  }
  updateImgCtrl();
}
function removeLayer(i){
  if(i<0||i>=S.ovLayers.length) return;
  S.ovLayers.splice(i,1);
  S.ovSel=Math.min(S.ovSel,S.ovLayers.length-1);
  if(typeof S.txtMode==='number'&&S.txtMode>=S.ovLayers.length) setTxtMode('new');
  renderLayers(); updateImgCtrl(); ovRedraw();
}
function renderLayers(){
  const list=document.getElementById('layerList');
  list.innerHTML='';
  if(!S.ovLayers.length){
    list.innerHTML='<div style="font-size:12px;color:var(--t3);text-align:center;padding:8px">추가된 레이어 없음</div>';
    return;
  }
  [...S.ovLayers].reverse().forEach((l,ri)=>{
    const i=S.ovLayers.length-1-ri;
    const item=mkEl('div','layer-item'+(i===S.ovSel?' sel':''));
    item.onclick=()=>selectLayer(i);
    const thumb=mkEl('div','l-thumb');
    if(l.type==='img'){
      const tc=mkCanvas(30,30); tc.getContext('2d').drawImage(l.img,0,0,30,30);
      const timg=mkEl('img'); timg.src=tc.toDataURL(); timg.style.cssText='width:30px;height:30px;object-fit:contain;';
      thumb.appendChild(timg);
    } else { thumb.textContent='T'; thumb.style.cssText=`background:#333;color:${l.color||'#fff'};`; }
    const info=mkEl('div','l-info');
    info.innerHTML=`<div class="l-name">${l.name}</div><div class="l-sub">${l.type==='img'?'이미지':'텍스트'}</div>`;
    const del=mkEl('button','l-del');
    del.innerHTML='<svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>';
    del.onclick=e=>{e.stopPropagation();removeLayer(i);};
    item.appendChild(thumb); item.appendChild(info); item.appendChild(del);
    list.appendChild(item);
  });
}
function updateImgCtrl(){
  const ctrl=document.getElementById('imgCtrl');
  if(S.ovSel>=0&&S.ovSel<S.ovLayers.length&&S.ovLayers[S.ovSel].type==='img'){
    const l=S.ovLayers[S.ovSel];
    ctrl.classList.add('on');
    document.getElementById('imgScale').value=l.scaleVal||100;
    document.getElementById('imgScaleV').textContent=Math.round(l.scaleVal||100)+'%';
    document.getElementById('imgOp').value=Math.round((l.opacity||1)*100);
    document.getElementById('imgOpV').textContent=Math.round((l.opacity||1)*100)+'%';
  } else { ctrl.classList.remove('on'); }
}
function dlOverlay(type){
  if(!S.ovBase){showToast('먼저 이미지를 변환해주세요');return;}
  const out=mkCanvas(S.ovBase.width,S.ovBase.height);
  const ctx=out.getContext('2d');
  ctx.drawImage(S.ovBase,0,0);
  S.ovLayers.forEach(l=>{
    ctx.save(); ctx.globalAlpha=l.opacity??1;
    if(l.type==='img'){ ctx.drawImage(l.img,l.x,l.y,l.w,l.h); }
    else {
      const lines=(l.content||'').split('\n');
      const lh=l.size*1.35;
      ctx.font=`bold ${l.size}px ${l.font||'sans-serif'}`;
      ctx.textBaseline='top';
      lines.forEach((line,li)=>{
        const lw=ctx.measureText(line).width;
        const lx=l.align==='center'?l.x-lw/2:l.align==='right'?l.x-lw:l.x;
        const ly=l.y+li*lh;
        if(l.strokeW>0){ctx.strokeStyle=l.stroke;ctx.lineWidth=l.strokeW*2;ctx.lineJoin='round';ctx.strokeText(line,lx,ly);}
        ctx.fillStyle=l.color; ctx.fillText(line,lx,ly);
      });
    }
    ctx.restore();
  });
  const fmt=type==='image/jpeg'?'jpeg':'png';
  saveImg(out,fmt);
}

// ─── PROGRESS ────────────────────────────────────
function showProg(t,s){
  const p=document.getElementById('prog'); p.classList.add('on');
  setProg(0,t,s);
}
function setProg(pct,t,s){
  document.getElementById('progBar').style.width=pct+'%';
  if(t) document.getElementById('progTtl').textContent=t;
  if(s!==undefined) document.getElementById('progSub').textContent=s;
}
function hideProg(){ document.getElementById('prog').classList.remove('on'); }

// ─── SHOW/HIDE ───────────────────────────────────
function hideRes(){ const r=document.getElementById('resCard'); r.classList.remove('on'); r.style.display='none'; }
function hideOv(){
  const o=document.getElementById('ovCard'); o.classList.remove('on'); o.style.display='none';
  S.ovLayers=[]; S.ovSel=-1; S.ovBase=null;
}

// ─── RESET ───────────────────────────────────────
function doReset(){
  S.file=null;S.img=null;S.iw=0;S.ih=0;S.tw=0;S.th=0;S.limit=false;S.mode='';
  S.compBlob=null;S.jpgQ=0.92;
  document.getElementById('upZone').style.display='';
  document.getElementById('stepCard').classList.add('hide');
  document.getElementById('resetBtn').classList.remove('on');
  document.getElementById('fi').value='';
  hideProg(); hideRes(); hideOv(); clearPresets();
  window.scrollTo({top:0,behavior:'smooth'});
}

// ─── HELPERS ─────────────────────────────────────
function mkCanvas(w,h){ const c=document.createElement('canvas');c.width=w;c.height=h;return c; }
function mkEl(tag,cls){ const e=document.createElement(tag);if(cls)e.className=cls;return e; }
function sleep(ms){ return new Promise(r=>setTimeout(r,ms)); }
function showToast(msg){
  const t=document.getElementById('toast'); t.textContent=msg; t.classList.add('on');
  setTimeout(()=>t.classList.remove('on'),2500);
}

// ─── INIT ─────────────────────────────────────────
initUpload();
initPresets();
initEditorDrag();
initProcess();
initOverlayUI();
initOverlayEvents();
</script>
</body>
